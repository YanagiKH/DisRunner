name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 11.19.0

jobs:
  quality:
    name: Quality, contracts, offline, build
    concurrency:
      group: ci-quality-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the pinned Electron distribution
        run: node apps/desktop/node_modules/electron/install.js

      - name: Check documentation links and assets
        run: node .github/scripts/check-docs.mjs

      - name: Check workspace versions
        run: pnpm run check:versions

      - name: Test credential scanner symlink boundaries
        run: pnpm run test:secret-scanner

      - name: Test release channels and signing prerequisites
        run: node --test .github/scripts/release-policy.test.mjs .github/scripts/verify-runtime-qualification.test.mjs

      - name: Test code scanning analysis and severity policy
        run: node --test .github/scripts/code-scanning-policy.test.mjs

      - name: Test Linux launcher and sandbox preparation
        run: pnpm run test:linux-sandbox

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Protocol contract tests
        run: pnpm run test:contract

      - name: Integration tests
        run: pnpm run test:integration

      - name: Offline egress tests
        run: pnpm run test:offline

      - name: Security tests
        run: pnpm run test:security

      - name: Desktop unit tests
        run: pnpm run test:desktop

      - name: Raw webhook adapter tests
        run: pnpm run test:raw-webhook

      - name: Build all workspaces
        run: pnpm run build

      - name: Build offline CLI archive
        run: node scripts/bundle-cli.mjs

      - name: Exercise the extracted CLI archive
        run: node .github/scripts/cli-artifact-smoke.mjs release/disrunner-cli-$(node -p "require('./package.json').version").tar.gz

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-${{ github.sha }}
          path: |
            apps/*/dist/**
            apps/*/dist-electron/**
            packages/*/dist/**
          if-no-files-found: error
          retention-days: 14

  cross-platform-e2e:
    name: E2E (${{ matrix.os }})
    concurrency:
      group: ci-e2e-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-python
      - name: Validate Windows release helper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem -LiteralPath .github/scripts -Filter '*.ps1') {
            $syntaxTokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$syntaxTokens, [ref]$syntaxErrors) | Out-Null
            if ($syntaxErrors.Count -ne 0) { throw ($syntaxErrors | Out-String) }
          }
      - name: Prepare pinned Python SDK dependencies
        run: python -m pip install --requirement packages/adapter-discordpy/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Prepare the pinned Electron distribution
        if: runner.os == 'Linux'
        run: node apps/desktop/node_modules/electron/install.js
      - name: Core unit tests
        run: pnpm run test:unit
      - name: Runtime-manager peer authentication tests
        run: pnpm --filter @disrunner/desktop run test:runtime-manager
      - name: CLI integration tests
        run: pnpm --filter @disrunner/cli run test:integration
      - name: Real SDK transport conformance
        run: node --test --test-concurrency=1 tests/conformance/*.test.mjs
      - name: Isolated offline raw webhook and SDK conformance
        if: runner.os == 'Linux'
        env:
          OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-conformance
        run: bash .github/scripts/offline-conformance.sh
      - name: Upload isolated offline evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-conformance
          if-no-files-found: warn
          retention-days: 30
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @disrunner/desktop exec playwright install-deps chromium
      - name: Install Chromium for E2E
        run: pnpm --filter @disrunner/desktop exec playwright install chromium
      - name: Run desktop E2E
        run: pnpm run test:e2e
      - name: Resolve the expected packaged version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'RELEASE_VERSION=' + require('./package.json').version + '\n')"
      - name: Build unsigned desktop distribution for acceptance
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @disrunner/desktop run package --publish never --config.forceCodeSigning=false --config.mac.notarize=false --config.dmg.sign=false
      - name: Smoke packaged Electron
        if: runner.os != 'Linux'
        run: pnpm --filter @disrunner/desktop run test:package-smoke
      - name: Prepare the pinned Linux sandbox helper for acceptance
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/installer-evidence"
          node .github/scripts/prepare-linux-sandbox.mjs apps/desktop/release/linux-unpacked > "$RUNNER_TEMP/installer-evidence/unpacked-suid.json"
      - name: Smoke packaged Electron on Linux
        if: runner.os == 'Linux'
        env:
          DISRUNNER_LINUX_SANDBOX_EVIDENCE: ${{ runner.temp }}/installer-evidence/unpacked-linux-sandbox
        run: xvfb-run -a pnpm --filter @disrunner/desktop run test:package-smoke
      - name: Install, exercise, reinstall and uninstall unsigned NSIS distribution
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PRERELEASE: 'true'
          DISRUNNER_INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-evidence
        run: ./.github/scripts/installer-roundtrip.ps1
      - name: Mount and exercise unsigned macOS distribution
        if: runner.os == 'macOS'
        env:
          RELEASE_PRERELEASE: 'true'
          DISRUNNER_INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-evidence
        run: bash .github/scripts/installer-roundtrip.sh
      - name: Extract and exercise Linux distribution
        if: runner.os == 'Linux'
        env:
          RELEASE_PRERELEASE: 'true'
          DISRUNNER_TEST_INSTALL_SUID_SANDBOX: '1'
          DISRUNNER_INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-evidence
        run: xvfb-run -a bash .github/scripts/installer-roundtrip.sh
      - name: Upload installed distribution and SDK UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/installer-evidence
          if-no-files-found: warn
          retention-days: 30
      # G1 is currently a Linux x64 candidate, not Windows/macOS qualification.
      - name: Build CLI for packaged G1 parity
        if: runner.os == 'Linux'
        run: pnpm --filter @disrunner/cli run build
      - name: Check packaged G1 parity on Linux
        id: g1_parity
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          G1_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/release/linux-unpacked/disrunner
          G1_EVIDENCE_DIR: ${{ github.workspace }}/apps/desktop/g1-evidence
        run: xvfb-run -a pnpm --filter @disrunner/desktop run test:g1-parity
      - name: Upload packaged G1 evidence
        if: always() && runner.os == 'Linux' && (steps.g1_parity.outcome == 'success' || steps.g1_parity.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g1-parity-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            apps/desktop/g1-evidence/*.json
            apps/desktop/g1-evidence/*.html
            apps/desktop/g1-evidence/*.png
            apps/desktop/g1-evidence/**/child-trace.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            apps/desktop/playwright-report/**
            apps/desktop/test-results/**
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Deterministic performance checks
    concurrency:
      group: ci-performance-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:perf

  runtime-qualification:
    name: Runtime qualification
    concurrency:
      group: ci-runtime-qualification-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      QUALIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-python
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned Python SDK dependencies
        run: python -m pip install --requirement packages/adapter-discordpy/requirements.txt
      - name: Check qualification measurements and receipt policy
        run: node --test --test-concurrency=1 tests/qualification/runtime-qualification.test.mjs .github/scripts/verify-runtime-qualification.test.mjs
      - name: Build the measured runtime
        run: pnpm run build:runtime
      - name: Measure lifecycle and sustained runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--python "$DISRUNNER_TEST_PYTHON" --out "$RUNNER_TEMP/runtime-qualification/runtime-qualification.json")
          if [ "$QUALIFICATION_MODE" = smoke ]; then
            arguments+=(--cycles 3 --duration-seconds 15)
          fi
          node scripts/qualify-runtime.mjs "${arguments[@]}"
      - name: Independently enforce the qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-runtime-qualification.mjs "$RUNNER_TEMP/runtime-qualification/runtime-qualification.json" \
            --mode "$QUALIFICATION_MODE" --sha "$GITHUB_SHA" \
            --version "$(node -p "require('./package.json').version")"
      - name: Upload runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-qualification/runtime-qualification.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  all-green:
    name: All green
    if: always()
    needs: [quality, cross-platform-e2e, performance, runtime-qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce every required job
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.cross-platform-e2e.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          QUALIFICATION: ${{ needs.runtime-qualification.result }}
        run: |
          test "$QUALITY" = success
          test "$E2E" = success
          test "$PERFORMANCE" = success
          test "$QUALIFICATION" = success
