packages:
  - apps/*
  - packages/*
  - examples/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

# Constrain vulnerable transitive versions within the parents' supported ranges.
overrides:
  'ajv@8.20.0>fast-uri': 3.1.8
  'node-gyp@12.4.0>undici': 6.28.1
  'minimatch@5.1.9>brace-expansion': 2.1.7
  'minimatch@9.0.9>brace-expansion': 2.1.7
  'cacheable-request@7.0.4>http-cache-semantics': 4.3.0
